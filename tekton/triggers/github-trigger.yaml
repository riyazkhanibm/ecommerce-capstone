# =============================================================================
# Path-filtered monorepo triggers
#
# One repository, four independently deployable components. An unfiltered
# webhook rebuilds all four on every push -- three Maven builds and a container
# build for a one-line README change.
#
# Each trigger below carries a CEL interceptor that inspects the changed file
# paths in the push payload and only fires when THAT component's directory was
# touched. Push to services/order-service/ and only order-service rebuilds.
#
# The expression walks body.commits[], because one push can carry several
# commits, and checks added + modified + removed -- a push that only deletes a
# file still changes the image.
#
#   oc apply -f tekton/triggers/github-trigger.yaml
#
# This replaces the earlier single-trigger EventListener in place.
# =============================================================================

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
spec:
  params:
    - name: git-repo-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: tt-product-service
spec:
  params:
    - name: git-repo-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: auto-product-service-
        labels:
          triggered-by: github-webhook
          component: product-service
      spec:
        pipelineRef:
          name: capstone-build-deploy
        taskRunTemplate:
          serviceAccountName: pipeline
        params:
          - name: GIT_URL
            value: $(tt.params.git-repo-url)
          - name: GIT_REVISION
            value: $(tt.params.git-revision)
          - name: CONTEXT_DIR
            value: services/product-service
          - name: BUILDCONFIG
            value: product-service
          - name: DEPLOYMENT_NAME
            value: product-service
        workspaces:
          - name: shared-workspace
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: tt-order-service
spec:
  params:
    - name: git-repo-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: auto-order-service-
        labels:
          triggered-by: github-webhook
          component: order-service
      spec:
        pipelineRef:
          name: capstone-build-deploy
        taskRunTemplate:
          serviceAccountName: pipeline
        params:
          - name: GIT_URL
            value: $(tt.params.git-repo-url)
          - name: GIT_REVISION
            value: $(tt.params.git-revision)
          - name: CONTEXT_DIR
            value: services/order-service
          - name: BUILDCONFIG
            value: order-service
          - name: DEPLOYMENT_NAME
            value: order-service
        workspaces:
          - name: shared-workspace
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: tt-user-service
spec:
  params:
    - name: git-repo-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: auto-user-service-
        labels:
          triggered-by: github-webhook
          component: user-service
      spec:
        pipelineRef:
          name: capstone-build-deploy
        taskRunTemplate:
          serviceAccountName: pipeline
        params:
          - name: GIT_URL
            value: $(tt.params.git-repo-url)
          - name: GIT_REVISION
            value: $(tt.params.git-revision)
          - name: CONTEXT_DIR
            value: services/user-service
          - name: BUILDCONFIG
            value: user-service
          - name: DEPLOYMENT_NAME
            value: user-service
        workspaces:
          - name: shared-workspace
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
