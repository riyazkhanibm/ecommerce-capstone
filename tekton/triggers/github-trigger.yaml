                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: tt-frontend
spec:
  params:
    - name: git-repo-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: auto-frontend-
        labels:
          triggered-by: github-webhook
          component: frontend
      spec:
        pipelineRef:
          name: capstone-build-nomaven
        taskRunTemplate:
          serviceAccountName: pipeline
        params:
          - name: GIT_URL
            value: $(tt.params.git-repo-url)
          - name: GIT_REVISION
            value: $(tt.params.git-revision)
          - name: CONTEXT_DIR
            value: frontend
          - name: BUILDCONFIG
            value: frontend
          - name: DEPLOYMENT_NAME
            value: frontend
        workspaces:
          - name: shared-workspace
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: capstone-listener
spec:
  serviceAccountName: pipeline
  triggers:

    - name: product-service
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                body.commits.exists(c,
                  c.added.exists(f, f.startsWith('services/product-service/')) ||
                  c.modified.exists(f, f.startsWith('services/product-service/')) ||
                  c.removed.exists(f, f.startsWith('services/product-service/')))
      bindings:
        - ref: github-push-binding
      template:
        ref: tt-product-service

    - name: order-service
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                body.commits.exists(c,
                  c.added.exists(f, f.startsWith('services/order-service/')) ||
                  c.modified.exists(f, f.startsWith('services/order-service/')) ||
                  c.removed.exists(f, f.startsWith('services/order-service/')))
      bindings:
        - ref: github-push-binding
      template:
        ref: tt-order-service

    - name: user-service
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                body.commits.exists(c,
                  c.added.exists(f, f.startsWith('services/user-service/')) ||
                  c.modified.exists(f, f.startsWith('services/user-service/')) ||
                  c.removed.exists(f, f.startsWith('services/user-service/')))
      bindings:
        - ref: github-push-binding
      template:
        ref: tt-user-service

    - name: frontend
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                body.commits.exists(c,
                  c.added.exists(f, f.startsWith('frontend/')) ||
                  c.modified.exists(f, f.startsWith('frontend/')) ||
                  c.removed.exists(f, f.startsWith('frontend/')))
      bindings:
        - ref: github-push-binding
      template:
        ref: tt-frontend
