# =============================================================================
# Step 10 (stretch) — automate pipeline triggering from a GitHub push
#
#   git push
#     -> GitHub POSTs a JSON payload to the EventListener's Route
#     -> the EventListener validates the shared secret and the event type
#     -> the TriggerBinding pulls fields out of the payload
#     -> the TriggerTemplate stamps out a PipelineRun with those values
#
# Apply:  oc apply -f tekton/triggers/github-trigger.yaml
#
# NOTE on the monorepo: this repository holds three services, so a naive
# trigger would fire three Maven builds for a one-line frontend change. This
# setup deliberately wires ONE service (product-service) to demonstrate the
# mechanism cleanly. The CEL interceptor at the bottom of the EventListener
# shows how you would branch on changed paths to do it properly.
# =============================================================================

# --- RBAC ---------------------------------------------------------------
# The EventListener runs as its own ServiceAccount and needs to CREATE
# PipelineRuns in this namespace. It does NOT need cluster-scoped rights.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers-role
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggerbindings", "triggertemplates", "triggers", "interceptors", "clusterinterceptors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-binding
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
roleRef:
  kind: Role
  name: tekton-triggers-role
  apiGroup: rbac.authorization.k8s.io

# --- TriggerBinding -----------------------------------------------------
# Maps fields out of GitHub's push payload into pipeline parameters.
# $(body.…) reaches into the JSON GitHub sends.
#
# body.ref arrives as "refs/heads/main", so the pipeline gets the full ref
# and git-clone resolves it -- more robust than string-trimming it here.
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
spec:
  params:
    - name: git-repo-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)
    - name: git-repo-name
      value: $(body.repository.name)

# --- TriggerTemplate ----------------------------------------------------
# The PipelineRun to create. Note git-revision is the exact commit SHA from
# the payload, not "main" -- so the image is built from the commit that was
# actually pushed, even if another push lands while this run is in flight.
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: capstone-trigger-template
spec:
  params:
    - name: git-repo-url
    - name: git-revision
    - name: git-repo-name
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: product-service-auto-
        labels:
          triggered-by: github-webhook
      spec:
        pipelineRef:
          name: capstone-build-deploy
        taskRunTemplate:
          serviceAccountName: pipeline
        params:
          - name: GIT_URL
            value: $(tt.params.git-repo-url)
          - name: GIT_REVISION
            value: $(tt.params.git-revision)
          - name: CONTEXT_DIR
            value: services/product-service
          - name: BUILDCONFIG
            value: product-service
          - name: DEPLOYMENT_NAME
            value: product-service
        workspaces:
          - name: shared-workspace
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi

# --- EventListener ------------------------------------------------------
# Creates a pod + Service listening on 8080. Expose it with a Route so
# GitHub can reach it from the public internet.
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: capstone-listener
spec:
  serviceAccountName: pipeline
  triggers:
    - name: github-push
      interceptors:
        # 1. Verify the payload really came from GitHub, using the shared
        #    secret configured on the webhook. Without this, anyone who
        #    discovers the Route URL can trigger your pipeline.
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        # 2. Only build pushes to main. Merge-request branches and tag
        #    pushes are ignored.
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.ref == 'refs/heads/main'"
      bindings:
        - ref: github-push-binding
      template:
        ref: capstone-trigger-template
