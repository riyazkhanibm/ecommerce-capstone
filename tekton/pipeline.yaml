# =============================================================================
# capstone-build-deploy — Developer Sandbox variant
#
# Stages:
#   1. fetch-source   git-clone (Tekton Hub)
#   2. maven-build    mvn clean package WITH tests — fails fast before we spend
#                     four minutes on an image build
#   3. build-and-push oc-build (was: buildah) — starts the service's BuildConfig,
#                     which pushes to the OpenShift internal registry (OCR)
#   4. deploy         openshift-client — rolls out the Deployment
#
# Only stage 3 differs from the upstream pipeline. buildah needs the privileged
# SCC, which a namespace-scoped account is denied; BuildConfigs delegate the
# build to the platform instead.
# =============================================================================
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: capstone-build-deploy
spec:
  params:
    - name: GIT_URL
      type: string
    - name: GIT_REVISION
      type: string
      default: main
    - name: CONTEXT_DIR
      description: Subdirectory holding this microservice, e.g. services/product-service
      type: string
    - name: BUILDCONFIG
      description: BuildConfig to start, e.g. product-service
      type: string
    - name: DEPLOYMENT_NAME
      description: Deployment to roll out after a successful push
      type: string
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.GIT_URL)
        - name: revision
          value: $(params.GIT_REVISION)

    - name: maven-build
      taskRef:
        name: maven-build
      runAfter: ["fetch-source"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: CONTEXT_DIR
          value: $(params.CONTEXT_DIR)

    - name: build-and-push
      taskRef:
        name: oc-build
      runAfter: ["maven-build"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: BUILDCONFIG
          value: $(params.BUILDCONFIG)
        - name: CONTEXT_DIR
          value: $(params.CONTEXT_DIR)

    - name: deploy
      taskRef:
        name: openshift-client
      runAfter: ["build-and-push"]
      params:
        - name: SCRIPT
          value: |
            oc rollout restart deployment/$(params.DEPLOYMENT_NAME)
            oc rollout status deployment/$(params.DEPLOYMENT_NAME) --timeout=300s
