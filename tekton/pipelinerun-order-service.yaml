apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: order-service-build-
spec:
  pipelineRef:
    name: capstone-build-deploy
  taskRunTemplate:
    serviceAccountName: pipeline
  params:
    - name: GIT_URL
      value: https://github.com/riyazkhanibm/ecommerce-capstone.git
    - name: GIT_REVISION
      value: main
    - name: CONTEXT_DIR
      value: services/order-service
    - name: BUILDCONFIG
      value: order-service
    - name: DEPLOYMENT_NAME
      value: order-service
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
