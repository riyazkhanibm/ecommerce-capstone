# =============================================================================
# capstone-build-nomaven
#
# Same as capstone-build-deploy with the maven-build stage removed. Used for
# the frontend, which is a static nginx image with no pom.xml -- running
# maven-build against it fails with "there is no POM in this directory".
#
# Keeping this as a separate Pipeline rather than making maven-build
# conditional keeps both definitions readable: one says "this component
# compiles", the other says "this one doesn't".
# =============================================================================
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: capstone-build-nomaven
spec:
  params:
    - name: GIT_URL
      type: string
    - name: GIT_REVISION
      type: string
      default: main
    - name: CONTEXT_DIR
      type: string
    - name: BUILDCONFIG
      type: string
    - name: DEPLOYMENT_NAME
      type: string
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.GIT_URL)
        - name: revision
          value: $(params.GIT_REVISION)

    - name: build-and-push
      taskRef:
        name: oc-build
      runAfter: ["fetch-source"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: BUILDCONFIG
          value: $(params.BUILDCONFIG)
        - name: CONTEXT_DIR
          value: $(params.CONTEXT_DIR)

    - name: deploy
      taskRef:
        name: openshift-client
      runAfter: ["build-and-push"]
      params:
        - name: SCRIPT
          value: |
            oc rollout restart deployment/$(params.DEPLOYMENT_NAME)
            oc rollout status deployment/$(params.DEPLOYMENT_NAME) --timeout=300s
