apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: frontend-build-
spec:
  pipelineRef:
    name: capstone-build-deploy
  taskRunTemplate:
    serviceAccountName: pipeline
  params:
    - name: GIT_URL
      value: https://github.com/riyazkhanibm/ecommerce-capstone.git
    - name: CONTEXT_DIR
      value: frontend
    - name: BUILDCONFIG
      value: frontend
    - name: DEPLOYMENT_NAME
      value: frontend
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 1Gi } }
