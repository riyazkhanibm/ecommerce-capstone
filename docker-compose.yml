version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: capstone-postgres
    environment:
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
      POSTGRES_DB: capstone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: ./services/product-service
    container_name: product-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/productdb
      DB_USER: capstone
      DB_PASSWORD: capstone
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    container_name: order-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_USER: capstone
      DB_PASSWORD: capstone
      PRODUCT_SERVICE_URL: http://product-service:8081
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started

  user-service:
    build: ./services/user-service
    container_name: user-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USER: capstone
      DB_PASSWORD: capstone
      JWT_SECRET: local-dev-secret-change-me
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:8080"
    depends_on:
      - product-service
      - order-service
      - user-service

volumes:
  pgdata:
