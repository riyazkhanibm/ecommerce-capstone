apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          # Replace with your OpenShift internal registry path after Tekton builds & pushes the image:
          # image-registry.openshift-image-registry.svc:5000/<project>/product-service:latest
          image: image-registry.openshift-image-registry.svc:5000/ecommerce-capstone/product-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://product-db:5432/productdb
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: product-db-credentials, key: POSTGRESQL_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: product-db-credentials, key: POSTGRESQL_PASSWORD } }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 20
