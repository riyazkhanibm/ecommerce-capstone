apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: image-registry.openshift-image-registry.svc:5000/ecommerce-capstone/order-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: DB_URL
              value: jdbc:postgresql://order-db:5432/orderdb
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: order-db-credentials, key: POSTGRESQL_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: order-db-credentials, key: POSTGRESQL_PASSWORD } }
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8081
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 40
            periodSeconds: 20
